name: Bake frames

# Prepares the challenge targets from the IRSA archive and stores the frames in the repository.
# Running it weekly also picks up new SPHEREx releases.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: write

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Bake
        env:
          BLINK_CACHE: data
          BLINK_WORKERS: "6"
        run: python -m scripts.bake
      - name: Store frames
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "chore: update baked frames"
          git push
