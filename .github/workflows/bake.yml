name: Bake frames

# Prepares the challenge targets from the IRSA archive and stores the frames in the repository.
# Running it weekly also picks up new SPHEREx releases.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: write
  actions: write

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - name: Bake
        env:
          BLINK_CACHE: data
          BLINK_WORKERS: "6"
        run: python -m scripts.bake
      - name: Build static site data
        env:
          BLINK_CACHE: data
        run: |
          python -m scripts.sky_tiles static/data/sky
          python -m scripts.build_site static/data
          python -m scripts.write_targets static/data
          node scripts/results.mjs static/data
      - name: Store frames
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data static/data
          git diff --cached --quiet || git commit -m "chore: update baked frames"
          git pull --rebase origin main
          git push
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
