<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SPHEREx Blink</title>
  <meta name="description" content="Compare NASA SPHEREx images of any patch of sky across dates and see what moved.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600&family=Unbounded:wght@400;600;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-view="sky">
  <div id="sky" class="sky"></div>
  <canvas id="ambient" class="ambient" width="48" height="27" aria-hidden="true"></canvas>
  <div id="spectrum-line" class="spectrum-line" aria-hidden="true"></div>

  <header class="top">
    <button id="back-to-sky" type="button" class="logo">SPHEREx<span>Blink</span></button>
    <form id="search" class="search">
      <input id="search-input" type="text" autocomplete="off" spellcheck="false" data-t-label="searchLabel" data-t-placeholder="searchPlaceholder">
      <button type="submit" data-t="open"></button>
    </form>
    <button id="tour" type="button" class="glow" data-t="tour"></button>
    <button id="language" type="button" class="ghost" aria-label="Language">RU</button>
  </header>

  <p id="caption" class="caption" hidden aria-live="polite"></p>

  <section id="hero" class="hero">
    <h1 data-t="heroTitle"></h1>
    <p class="hero-sub" data-t="heroSub"></p>
    <button id="open-here" type="button" class="glow" hidden data-t="openHere"></button>
    <nav id="presets" class="presets" aria-label="Targets"></nav>
  </section>

  <main id="observatory" class="observatory" hidden>
    <section class="plate-wrap">
      <div class="plate-frame">
        <canvas id="plate" width="1100" height="1100" tabindex="0"></canvas>
        <p id="plate-date" class="plate-date"></p>
        <p id="plate-empty" class="plate-empty" hidden></p>
      </div>
    </section>

    <aside class="side">
      <header class="object">
        <p id="object-kind" class="object-kind"></p>
        <h2 id="object-name"></h2>
        <p id="object-coords" class="note"></p>
        <p id="progress" class="progress" role="status"></p>
      </header>

      <div id="motion-result" class="motion-result"></div>
      <button id="measure" type="button" class="glow" data-t="measure"></button>

      <section class="measure">
        <div class="segment" role="group" id="chart-kind">
          <button type="button" data-chart="spectrum" data-t="spectrum"></button>
          <button type="button" data-chart="curve" data-t="lightCurve"></button>
        </div>
        <div id="chart" class="chart"></div>
        <p id="chart-note" class="note"></p>
      </section>

    </aside>

    <footer class="deck">
      <div class="timeline">
        <button id="play" type="button" class="glow"></button>
        <div id="dates" class="dates" role="group"></div>
        <div class="tools">
          <div class="segment" role="group" id="modes">
            <button type="button" data-mode="video" data-t="modeVideo"></button>
            <button type="button" data-mode="sum" data-t="modeSum"></button>
            <button type="button" data-mode="diff" data-t="modeDiff"></button>
          </div>
          <label class="tool"><span data-t="fieldOfView"></span>
            <select id="fov">
              <option value="0.05">3′</option>
              <option value="0.1">6′</option>
              <option value="0.2">12′</option>
              <option value="0.5">30′</option>
            </select>
          </label>
          <label class="tool"><input id="gaia" type="checkbox"><span data-t="gaia"></span></label>
          <label class="tool"><input id="wise" type="checkbox"><span data-t="wise"></span></label>
          <label class="tool"><input id="flags" type="checkbox"><span data-t="excludeFlags"></span></label>
        </div>
      </div>
      <div class="bands">
        <button id="composite" type="button" data-t="composite"></button>
        <div class="band-track">
          <div id="band-scale" class="band-scale" aria-hidden="true"></div>
          <input id="band" type="range" min="0" max="101" step="1" value="0" data-t-label="bandSlider">
        </div>
        <output id="band-label"></output>
      </div>
      <p class="note"><span id="plate-info"></span> <span data-t="credit"></span></p>
    </footer>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
